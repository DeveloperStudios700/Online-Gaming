<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Gaming</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;900&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    color:white;
    overflow-x:hidden;

    background:
    radial-gradient(circle at top left,#ff003c55,transparent 30%),
    radial-gradient(circle at top right,#0066ff55,transparent 30%),
    radial-gradient(circle at bottom,#001133,transparent 50%),
    #050816;
}

/* PARTICLES */

#particles-js{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:-1;
}

/* GLOW EFFECTS */

.glow-red{
    position:fixed;
    width:500px;
    height:500px;
    background:#ff003c;
    filter:blur(180px);
    opacity:0.18;
    top:-150px;
    left:-150px;
    z-index:-2;
}

.glow-blue{
    position:fixed;
    width:500px;
    height:500px;
    background:#0066ff;
    filter:blur(180px);
    opacity:0.18;
    bottom:-150px;
    right:-150px;
    z-index:-2;
}

/* HERO */

.hero{
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
}

.hero h1{
    font-size:6rem;
    font-weight:900;
    background:linear-gradient(90deg,#ff003c,#0066ff);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    text-shadow:0 0 30px rgba(255,255,255,.1);
}

.hero p{
    max-width:800px;
    margin-top:20px;
    font-size:1.3rem;
    color:#ddd;
}

.hero button{
    margin-top:35px;
    padding:15px 35px;
    border:none;
    border-radius:50px;
    background:linear-gradient(90deg,#ff003c,#0066ff);
    color:white;
    font-size:18px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}

.hero button:hover{
    transform:scale(1.08);
    box-shadow:0 0 25px rgba(0,102,255,.5);
}

/* SAMPLE CONTENT */

.section{
    max-width:1000px;
    margin:auto;
    padding:80px 20px;
}

.card{
    background:rgba(255,255,255,.05);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,.1);
    border-radius:20px;
    padding:30px;
}

.card h2{
    color:#0066ff;
    margin-bottom:15px;
}

</style>
</head>
<body>

<div id="particles-js"></div>

<div class="glow-red"></div>
<div class="glow-blue"></div>

<section class="hero">

    <h1>ONLINE GAMING</h1>

    <p>
        Exploring the benefits, risks and impact of online gaming in today's digital world.
    </p>

    <button>Explore</button>

</section>

<section class="section">
    <div class="card">
        <h2>About Online Gaming</h2>
        <p>
            Online gaming allows players around the world to connect,
            compete and cooperate using computers, mobile devices and consoles.
        </p>
    </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js"></script>

<script>
tsParticles.load("particles-js", {
    particles: {
        number: {
            value: 120
        },

        color: {
            value: ["#ff003c", "#0066ff"]
        },

        links: {
            enable: true,
            distance: 150,
            color: "#ffffff",
            opacity: 0.15
        },

        move: {
            enable: true,
            speed: 2
        },

        size: {
            value: 3
        },

        opacity: {
            value: 0.6
        }
    },

    background: {
        color: "transparent"
    }
});
</script>

</body>
</html>
